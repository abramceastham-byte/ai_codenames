# Everything for the tournament in Docker.
#
#   docker compose run --rm tournament                  # every pair twice
#   docker compose run --rm tournament --teams a,b      # only some teams
#   docker compose run --rm tournament match test_student test_student_2
#   docker compose run --rm tournament replay logs/<file>.jsonl
#
# Bots that use Ollama: add the profile to also start the bundled server,
#   OLLAMA_MODEL=gemma3:1b docker compose --profile ollama run --rm tournament
# Bots find the model name in $OLLAMA_MODEL and the server in $OLLAMA_HOST.
# The model is pulled on first use and kept in the `ollama` volume (or set
# OLLAMA_MODELS_DIR to reuse a host folder, e.g. ~/.ollama). The server keeps
# running afterwards; stop it with `docker compose --profile ollama down`.
services:
  tournament:
    build:
      context: .
      dockerfile: Dockerfile.tournament
    volumes:
      - ./students:/app/students
      - ./logs:/app/logs
      # Packages from students/*/requirements.txt, kept between runs.
      - pydeps:/deps
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # `run` only starts services listed here. Without --profile ollama this one
    # is skipped (required: false); with it, the tournament waits until it's up.
    depends_on:
      ollama:
        condition: service_healthy
        required: false

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama}:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 30
    # For an NVIDIA GPU (needs the NVIDIA Container Toolkit), uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  pydeps:
  ollama:
