# Local development: the game server plus the frontend dev server.
#
# The server owns the API, the bot WebSocket and the SQLite database. Student
# bots connect from the host (or anywhere) over the bot protocol, so there is no
# AI service to run here any more.
services:
  web-server:
    build:
      context: .
      dockerfile: Dockerfile.websrv
    volumes:
      - web-data:/data
    command:
      - --db_path=/data/codenames.db
      - --hash_key_path=/data/hashKey
      - --block_key_path=/data/blockKey
    ports:
      - "${WEB_SERVER_PORT:-8080}:8080"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm --store-dir /pnpm-store install && pnpm exec vite dev --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://web-server:8080
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-pnpm-store:/pnpm-store
    ports:
      - "5173:5173"
    depends_on:
      - web-server

volumes:
  web-data:
  frontend-node-modules:
  frontend-pnpm-store:
