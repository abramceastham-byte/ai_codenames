services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.websrv
      args:
        PUBLIC_API_URL: ""
    restart: unless-stopped
    environment:
      ADDR: :8080
      DB_PATH: /state/codenames.db
      HASH_KEY_PATH: /state/hashKey
      BLOCK_KEY_PATH: /state/blockKey
      LOG_DIR: /state/logs
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AI_SERVER_ENDPOINT: http://ai:8081
      ALLOWED_ORIGIN: https://${DOMAIN:?set DOMAIN}
      SECURE_COOKIES: "true"
    volumes:
      - app_state:/state
    depends_on:
      ai:
        condition: service_healthy

  ai:
    build:
      context: .
      dockerfile: Dockerfile.aisrv
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      WEB_SERVER_ENDPOINT: http://web:8080
      ENABLED_BACKENDS: ${ENABLED_BACKENDS:-llm}
      DEFAULT_BACKEND: ${DEFAULT_BACKEND:-llm}
      GLOVE_MODEL_PATH: /models/glove.bin
      CONCEPT_NET_MODEL_PATH: /models/conceptnet.bin
      COMMON_WORDLIST: /models/common_words.txt
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
    volumes:
      - ./data:/models:ro

  ollama:
    image: ollama/ollama:0.11.6
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    profiles: ["ollama"]

volumes:
  app_state:
  caddy_data:
  caddy_config:
  ollama_data:
